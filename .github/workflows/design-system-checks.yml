name: Design System Checks

on:
  push:
    branches: [main]
    paths:
      - "vois-tokens/**"
      - "vois-patterns/**"
      - "vois-components/**"
      - "vois-eval/**"
      - "vois-dataviz/**"
      - "scripts/**"
      - "vois-teams/**"
      - "skills.json"
      - "**/SKILL.md"
      - "**/references/**"
      - "**/data/**"
  pull_request:
    paths:
      - "vois-tokens/**"
      - "vois-patterns/**"
      - "vois-components/**"
      - "vois-eval/**"
      - "vois-dataviz/**"
      - "scripts/**"
      - "vois-teams/**"
      - "skills.json"
      - "**/SKILL.md"
      - "**/references/**"
      - "**/data/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # same as mirror-check.yml, so the two workflows run the same Node

      - name: Detector regression suite (vois-tokens)
        run: node vois-tokens/scripts/detect.test.mjs

      - name: Lookalike scanner fixtures (vois-eval)
        run: node vois-eval/lookalike-pass/scan.test.mjs

      - name: Eval scenarios match the decision trees (vois-eval)
        run: node vois-eval/check-scenarios.mjs

      - name: Eval runner tests, with the model stubbed (vois-eval)
        run: node --test vois-eval/run/run.test.mjs

      - name: Committed eval results are well formed and have not regressed (vois-eval)
        run: node vois-eval/check-results.mjs

      - name: Data viz scripts and data integrity (vois-dataviz)
        run: node vois-dataviz/scripts/dataviz.test.mjs

      - name: Data viz generated references are up to date
        run: node vois-dataviz/scripts/build-reference.mjs --check

      - name: Team overrides, ranges and proposals (vois-teams)
        run: |
          node vois-teams/scripts/validate.test.mjs
          node vois-teams/scripts/validate.mjs all

      - name: Rule ID cross-reference sync (vois-tokens, vois-patterns)
        run: node scripts/check-rule-sync.mjs

      - name: Every rule says how it is verified, and detectors match the code
        run: python3 scripts/check-verification.py

      - name: Verification check tests
        run: python3 scripts/check-verification.test.py

      - name: SKILL.md frontmatter validation
        run: bash scripts/validate-skills.sh

      - name: Routing and link audit (paths, skills, work types, graph, rule IDs)
        run: python3 scripts/check-routing.py

  # Its own job: it is the only check that needs a newer Node (module.stripTypeScriptTypes, 22.13+),
  # and moving the whole job would change the runtime of every other check.
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Motion logic helpers (vois-components)
        run: node vois-components/scripts/motion-logic.test.mjs
