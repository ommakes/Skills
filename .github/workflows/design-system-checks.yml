name: Design System Checks

# No path filter on purpose. The list kept falling behind the skill folders
# (righter, conversion-patterns, design-ask and others were missing), so a
# change there skipped its own checks. The job takes a couple of minutes, which
# is cheaper than another missed check.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"   # same as mirror-check.yml, so the two workflows run the same Node

      - name: Detector regression suite (vois-tokens)
        run: node vois-tokens/scripts/detect.test.mjs

      - name: CI gate tests (vois-tokens check.mjs)
        run: node vois-tokens/scripts/check.test.mjs

      - name: ESLint plugin tests (vois-tokens eslint-plugin, pinned ESLint)
        working-directory: vois-tokens/eslint-plugin
        run: |
          npm ci --ignore-scripts
          node --test index.test.mjs

      - name: Grid and panel maths (vois-tokens)
        run: node vois-tokens/scripts/grid.test.mjs

      - name: Lookalike scanner fixtures (vois-eval)
        run: node vois-eval/lookalike-pass/scan.test.mjs

      - name: Eval scenarios match the decision trees (vois-eval)
        run: node vois-eval/check-scenarios.mjs

      - name: Eval runner tests, with the model stubbed (vois-eval)
        run: node --test vois-eval/run/run.test.mjs

      - name: Committed eval results are well formed and have not regressed (vois-eval)
        run: node vois-eval/check-results.mjs

      - name: Data viz scripts and data integrity (vois-dataviz)
        run: node vois-dataviz/scripts/dataviz.test.mjs

      - name: Data viz generated references are up to date
        run: node vois-dataviz/scripts/build-reference.mjs --check

      - name: Team overrides, ranges and proposals (vois-teams)
        run: |
          node vois-teams/scripts/validate.test.mjs
          node vois-teams/scripts/validate.mjs all

      - name: Field table schema and rules (vois-fields)
        run: |
          node vois-fields/scripts/check-fields.test.mjs
          node vois-fields/scripts/check-fields.mjs

      - name: Questionnaire data (vois-patterns)
        run: |
          npm i --no-save --no-package-lock ajv
          node vois-patterns/scripts/check-questions.mjs

      - name: Elevation map and rules (vois-tokens)
        run: |
          node vois-tokens/scripts/elevation-map.test.mjs
          node vois-tokens/scripts/elevation-map.mjs

      - name: Rule ID cross-reference sync (vois-tokens, vois-patterns)
        run: node scripts/check-rule-sync.mjs

      - name: A Figma edition at its source version names every source id
        run: |
          node scripts/check-editions.test.mjs
          node scripts/check-editions.mjs

      - name: Every conversion-patterns rule is referenced and consistent
        run: node conversion-patterns/scripts/check-rule-sync.mjs

      - name: Every rule says how it is verified, and detectors match the code
        run: python3 scripts/check-verification.py

      - name: Verification check tests
        run: python3 scripts/check-verification.test.py

      - name: SKILL.md frontmatter validation
        run: bash scripts/validate-skills.sh

      - name: Routing and link audit (paths, skills, work types, graph, rule IDs)
        run: python3 scripts/check-routing.py

  # The registry is the only part that installs packages. It runs on every PR, like the job above,
  # so a change to the detector or the token docs still rebuilds it. Its own job because it needs the
  # Node that registry/package.json declares (22.13+); the checks job stays on 20.
  registry-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: registry
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: registry/package-lock.json

      - name: Registry items, paths, theme mappings and detector (no install)
        run: |
          node scripts/build-tokens.test.mjs
          node scripts/check-registry.test.mjs
          node scripts/check-registry.mjs

      # --ignore-scripts: the build only needs the CLI, so no dependency's install script runs.
      - name: Install the pinned shadcn CLI
        run: npm ci --ignore-scripts --no-audit --no-fund

      # shadcn build copies the components into JSON without compiling them, and the other checks read them with
      # regexes. This parses every .ts and .tsx file, so a bracket lost in a merge fails here.
      - name: Parse every registry component (syntax only)
        run: npm run syntax

      - name: The syntax check's own tests
        run: npm run syntax:test
      - name: The panel layout's decision logic, against grid-logic.mjs
        run: npm run panel:test

      # The syntax check does not read types. This compiles every component the way an app does (strict, React 19
      # types, @/ imports resolved to the registry files), so a wrong prop or a broken import between items fails here.
      - name: Type-check every registry component
        run: npm run typecheck
      - name: The type check's own tests (misuse such as an IconButton without a label must not compile)
        run: npm run typecheck:test
      - name: IconButton renders its label as the name, and keeps its tooltip closed when disabled
        run: npm run icon-button:test
      # Needs playwright and Chromium; where they are missing the test reports itself skipped.
      - name: Menubar keys and safe triangle in a real browser
        run: npm run menubar:test
      - name: InputOTP typing, paste and states in a real browser
        run: npm run input-otp:test
      - name: Drawer focus, keys, drag and reduced motion in a real browser
        run: npm run drawer:test
      - name: Carousel keys, end buttons and reduced motion in a real browser
        run: npm run carousel:test
      - name: Resizable drag, keys and focus ring in a real browser
        run: npm run resizable:test

      # The accessibility harness (registry/harness, a dev tool) renders every registry:ui item. These check that none is
      # left off a page and that vois-render.json is what the stories give. The rendered check itself runs only in the
      # private repo, which has the vois-loop scripts.
      - name: The harness check's own tests
        run: npm run harness:test
      - name: Every registry item is on a harness page
        run: npm run harness:check

      - name: Build the registry (shadcn validates every item against its schema)
        run: npm run build

  # Its own job: it is the only check that needs a newer Node (module.stripTypeScriptTypes, 22.13+),
  # and moving the whole job would change the runtime of every other check.
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Motion logic helpers (vois-components)
        run: node vois-components/scripts/motion-logic.test.mjs

      - name: Retrieval index and query tool (vois-components)
        run: |
          node vois-components/scripts/retrieval.test.mjs
          node vois-components/scripts/retrieval.mjs
