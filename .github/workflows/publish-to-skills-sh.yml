name: Publish Skills to skills.sh

on:
  push:
    branches:
      - main
    paths:
      - '*/SKILL.md'
      - 'skills.json'
      - '.github/workflows/publish-to-skills-sh.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate skills metadata
        run: bash scripts/validate-skills.sh

      - name: Parse and publish skills
        env:
          SKILLS_SH_API_TOKEN: ${{ secrets.SKILLS_SH_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # If no API token, skip publishing (expected during initial setup)
          if [ -z "$SKILLS_SH_API_TOKEN" ]; then
            echo "⚠️  SKILLS_SH_API_TOKEN not set. Skipping publication."
            echo "To enable publishing:"
            echo "1. Go to https://skills.sh and generate an API token"
            echo "2. Add it to GitHub secrets: https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions"
            echo "3. Secret name: SKILLS_SH_API_TOKEN"
            exit 0
          fi

          echo "📦 Publishing skills to skills.sh..."

          # Create a simple Node.js script to publish skills
          cat > publish.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          const https = require('https');

          const token = process.env.SKILLS_SH_API_TOKEN;
          const repo = process.env.GITHUB_REPOSITORY;

          // Find all SKILL.md files and extract metadata
          const skills = [];
          const dirs = fs.readdirSync('.').filter(f =>
            fs.statSync(f).isDirectory() && !f.startsWith('.')
          );

          for (const dir of dirs) {
            const skillFile = path.join(dir, 'SKILL.md');
            if (!fs.existsSync(skillFile)) continue;

            const content = fs.readFileSync(skillFile, 'utf8');
            const lines = content.split('\n');

            // Parse YAML frontmatter
            if (lines[0] === '---') {
              const metadata = {};
              let i = 1;

              while (i < lines.length && lines[i] !== '---') {
                const line = lines[i];
                if (line.includes(':')) {
                  const [key, ...valueParts] = line.split(':');
                  let value = valueParts.join(':').trim();

                  // Remove quotes
                  if ((value.startsWith('"') && value.endsWith('"')) ||
                      (value.startsWith("'") && value.endsWith("'"))) {
                    value = value.slice(1, -1);
                  }

                  metadata[key.trim()] = value;
                }
                i++;
              }

              if (metadata.name && metadata.version && metadata.description) {
                skills.push({
                  name: metadata.name,
                  version: metadata.version,
                  description: metadata.description,
                  author: metadata.author || 'Personify Labs',
                  path: dir,
                  repository: repo
                });
                console.log(`✅ ${metadata.name} v${metadata.version}`);
              }
            }
          }

          if (skills.length === 0) {
            console.log('⚠️  No skills found to publish');
            process.exit(0);
          }

          console.log(`\n🚀 Attempting to publish ${skills.length} skills...\n`);

          // Publish each skill
          let completed = 0;
          let succeeded = 0;

          skills.forEach(skill => {
            const payload = JSON.stringify(skill);
            const options = {
              hostname: 'skills.sh',
              port: 443,
              path: '/api/v1/skills',
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Content-Length': payload.length,
                'Authorization': `Bearer ${token}`
              }
            };

            const req = https.request(options, (res) => {
              let data = '';
              res.on('data', chunk => data += chunk);
              res.on('end', () => {
                completed++;
                if (res.statusCode === 200 || res.statusCode === 201) {
                  console.log(`✅ Published: ${skill.name}`);
                  succeeded++;
                } else {
                  console.warn(`⚠️  ${skill.name}: ${res.statusCode}`);
                }
              });
            });

            req.on('error', err => {
              completed++;
              console.error(`❌ ${skill.name}: ${err.message}`);
            });

            req.write(payload);
            req.end();
          });
          EOF

          node publish.js

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Failed to publish skills to skills.sh"
          echo "Check GitHub Secrets for SKILLS_SH_API_TOKEN"
