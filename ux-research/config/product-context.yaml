# product-context.yaml — the one place product/org-specific facts live.
#
# survey-architect's methodology (instrument selection, sample-size
# floors, trigger/frequency logic) is generic and portable. The list of
# products it should recognize during intake is not — that's specific to
# whoever's running these skills. Editing this file is how you retarget
# the skill family at a different org without touching any SKILL.md.
#
# research-loop and feedback-synthesizer also read `products` (to
# validate a study's stated product against a known list) and
# `benchmarks_root` (to build /research/_benchmarks/<product>.md paths).

products:
  - Personify
  - Vois
  - Righter
  - Unsoku
  - Localwolla
  - Smileframe
  - Uslo

# If a requester names a product outside this list, don't reject it —
# ask whether it's a new product to track (add it here) or a typo of an
# existing one. Never silently file it under the closest match.
unknown_product_policy: ask_dont_guess

research_root: /research
benchmarks_root: /research/_benchmarks
